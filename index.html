<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanger Hub TeleCRM</title>
    <meta name="description" content="Multi-user TeleCRM and Lead Management application for Hanger Hub Ceiling Hanger." />
    <meta property="og:title" content="Hanger Hub TeleCRM" />
    <meta property="og:description" content="Multi-user TeleCRM and Lead Management application for Hanger Hub Ceiling Hanger." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('Cannot set property fetch of #<Window>')) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
      }, true);
      const originalOnError = window.onerror;
      window.onerror = function(msg, url, line, col, error) {
        if (msg && msg.includes('Cannot set property fetch of #<Window>')) {
          return true;
        }
        if (originalOnError) return originalOnError(msg, url, line, col, error);
      };
      
      // Also try to intercept unhandledrejection just in case
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('Cannot set property fetch of #<Window>')) {
          e.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
